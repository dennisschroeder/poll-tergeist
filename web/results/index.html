<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poll-tergeist — results</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 32rem;
    margin: 3rem auto;
    padding: 0 1rem;
    line-height: 1.4;
  }
  h1 { font-size: 1.4rem; }
  #bars { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .bar-row .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    margin-bottom: 0.25rem;
  }
  .bar-track {
    width: 100%;
    height: 1.25rem;
    background: rgba(128, 128, 128, 0.2);
    border-radius: 0.3rem;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: #3b82f6;
    width: 0%;
    transition: width 0.3s ease;
  }
  #total {
    margin-top: 1.5rem;
    opacity: 0.7;
    font-size: 0.9rem;
  }
  #error {
    color: #c0392b;
    margin-top: 1rem;
    display: none;
  }
</style>
</head>
<body>
  <h1 id="question">Loading…</h1>
  <div id="bars"></div>
  <div id="total"></div>
  <div id="error" role="alert"></div>

  <script src="/app.js"></script>
  <script>
    const { id } = pollIdFromPath();
    const questionEl = document.getElementById('question');
    const barsEl = document.getElementById('bars');
    const totalEl = document.getElementById('total');
    const errorEl = document.getElementById('error');

    let options = []; // [{ id, position, label }], sorted by position

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function renderBars(tally) {
      const counts = options.map((opt) => tally[opt.id] ?? 0);
      const total = counts.reduce((a, b) => a + b, 0);

      options.forEach((opt, i) => {
        const count = counts[i];
        const pct = total === 0 ? 0 : (count / total) * 100;

        let row = document.getElementById(`bar-${opt.id}`);
        if (!row) {
          row = document.createElement('div');
          row.id = `bar-${opt.id}`;
          row.className = 'bar-row';
          row.innerHTML = `
            <div class="bar-label">
              <span class="bar-name"></span>
              <span class="bar-count"></span>
            </div>
            <div class="bar-track"><div class="bar-fill"></div></div>
          `;
          barsEl.appendChild(row);
        }

        row.querySelector('.bar-name').textContent = opt.label;
        row.querySelector('.bar-count').textContent = `${count} vote${count === 1 ? '' : 's'}`;
        row.querySelector('.bar-fill').style.width = `${pct}%`;
      });

      totalEl.textContent = `${total} total vote${total === 1 ? '' : 's'}`;
    }

    async function init() {
      if (!id) {
        showError('No poll id in the URL.');
        return;
      }

      let poll;
      try {
        poll = await fetchPoll(id);
      } catch (err) {
        questionEl.textContent = 'Poll unavailable';
        showError(err.message);
        return;
      }

      questionEl.textContent = poll.question;
      options = poll.options.slice().sort((a, b) => a.position - b.position);
      renderBars(poll.tally || {});

      openTallyStream(id, renderBars);
    }

    init();
  </script>
</body>
</html>
