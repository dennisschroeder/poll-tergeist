services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: poll
      POSTGRES_DB: poll_tergeist
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll -d poll_tergeist"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
